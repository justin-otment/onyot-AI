name: Inspect MiamiDade Page

on:
  workflow_dispatch:   # manual trigger only

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   # matches "engines": { "node": ">=20" }
          cache: 'npm'         # uses package-lock.json for dependency caching

      - name: Install dependencies
        run: npm ci            # clean install using package-lock.json

      - name: Run inspection script
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node inspectMiamidade.js

      # Optional: upload results if you write them to a file
      # - name: Upload inspection results
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: inspection-results
      #     path: results.json
