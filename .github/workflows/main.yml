name: Run Scrapers

on:
  workflow_dispatch:

jobs:

  AddressURL_gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode Service Account JSON
        working-directory: "leadOrganizer"
        run: echo "${{ secrets.GCP_KEY_BASE64 }}" | base64 -d > service-account.json
      - name: Run corpTracer-1.js
        working-directory: "leadOrganizer"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./service-account.json"
          GOOGLE_TOKEN_JSON: "./google-token.json"
        run: node ADDRESS+URL-individuals.cjs

  CorpTracer:
    runs-on: ubuntu-latest
    needs: AddressURL_gen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Chrome and Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install dependencies (fallback to npm install if no lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode Service Account JSON
        working-directory: "Property Appraiser Scripts"
        run: base64 -d service-account_base64.txt > service-account.json

      - name: Run Corp Tracer Port Charlotte script
        working-directory: "Property Appraiser Scripts"
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
        run: node corpTracer.js
        
  AddressURL_gen1:
    runs-on: ubuntu-latest
    needs: CorpTracer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode Service Account JSON
        working-directory: "leadOrganizer"
        run: echo "${{ secrets.GCP_KEY_BASE64 }}" | base64 -d > service-account.json
      - name: Run corpTracer-1.js
        working-directory: "leadOrganizer"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./service-account.json"
          GOOGLE_TOKEN_JSON: "./google-token.json"
        run: node address+url-companies.cjs
