name: Run Scrapers

on:
  workflow_dispatch:

jobs:
  Lee_PA:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install dependencies (create lockfile fallback)
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found, running npm ci"
            npm ci
          else
            echo "package-lock.json not found, generating lockfile then running npm ci"
            npm install --package-lock-only
            npm ci
          fi

      - name: Decode Service Account JSON
        working-directory: "Property Appraiser Scripts"
        run: base64 -d service-account_base64.txt > service-account.json

      - name: Run Lee Appraiser script
        working-directory: "Property Appraiser Scripts"
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
        run: // node leePA.mjs <<<---  uncomment to activate

  charlotte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Chrome and Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install dependencies (fallback to npm install if no lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode Service Account JSON
        working-directory: "Property Appraiser Scripts"
        run: base64 -d service-account_base64.txt > service-account.json

      - name: Run Charlotte Appraiser script
        working-directory: "Property Appraiser Scripts"
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
        run: node charlottePA.js

  CorpTracer:
