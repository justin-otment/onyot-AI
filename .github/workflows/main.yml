name: Run Scrapers

on:
  workflow_dispatch:

jobs:
  corpTracer_PalmBay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: onyot-AI
        run: npm ci

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Decode Service Account JSON
        working-directory: onyot-AI/Property Appraiser Scripts
        run: echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d > service-account.json

      - name: Run corpTracer script
        working-directory: onyot-AI/Property Appraiser Scripts
        run: node corpTracer.js

  charlotte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: onyot-AI
        run: npm ci

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libxss1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Decode Service Account JSON
        working-directory: onyot-AI/Property Appraiser Scripts
        run: echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d > service-account.json

      - name: Run Charlotte script
        working-directory: onyot-AI/Property Appraiser Scripts
        run: node charlottePA.js
