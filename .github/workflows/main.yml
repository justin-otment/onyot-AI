name: Run Scrapers

on:
  workflow_dispatch:

jobs:
  corpTracer1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Ensure Chrome is installed
        run: google-chrome --version || sudo apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Decode Service Account JSON
        working-directory: "Property Appraiser Scripts"
        run: echo "${{ secrets.GCP_KEY_BASE64 }}" | base64 -d > service-account.json
      - name: Run corpTracer-1.js
        working-directory: "Property Appraiser Scripts"
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
        run: node corpTracer.js

