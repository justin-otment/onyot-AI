name: Enrich Addresses

on:
  workflow_dispatch:   # manual trigger only

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Decode the base64-encoded service account JSON secret
      - name: Decode Service Account JSON
        run: echo "${{ secrets.GCP_KEY_BASE64 }}" | base64 -d > service-account.json

      # Run your enrichment script with environment variables
      - name: Run fullAddress.js
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
        run: node fullAddress.js
