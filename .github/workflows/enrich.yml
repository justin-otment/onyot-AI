name: Run Search Extractor

on:
  workflow_dispatch:

jobs:
  googleSearchExtractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Ensure Chrome is installed
        run: google-chrome --version || sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode Service Account JSON
        working-directory: "Google Scripts"
        run: echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d > service-account.json

      - name: Decode Google Token JSON
        working-directory: "Google Scripts"
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON }}" | base64 -d > google-token.json

      - name: Run fullAddress.js
        working-directory: "Google Scripts"
        env:
          HEADLESS: 'true'
          CHROME_PATH: '/usr/bin/google-chrome-stable'
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'
          GOOGLE_TOKEN_PATH: './google-token.json'
        run: node fullAddress.js
