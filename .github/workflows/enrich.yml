name: Run Full Address Scraper

on:
  workflow_dispatch:

jobs:
  fullAddressJob:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Decode service-account.json
        run: echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > service-account.json

      - name: Decode google-token.json
        run: echo "${{ secrets.GOOGLE_TOKEN_JSON_BASE64 }}" | base64 -d > google-token.json

      - name: Run fullAddress.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./service-account.json"
          GOOGLE_TOKEN_JSON: "./google-token.json"
        run: node fullAddress.js